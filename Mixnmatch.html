<body>

  <style>
    #titlemap {
        position: absolute;

    #map {
     
        position: a;
        width: 100%;
        height: 500px;
        
        z-index: 0;

    }
</style>

<div class="navbar-container"></div>

<main>
  

  <div class="home-herotext">
    <h1>Mix n Match </h1>
  </div>

  
  <div id="map">
  
    <script>

        // The value for 'accessToken' begins with 'pk...'
        mapboxgl.accessToken = 'pk.eyJ1IjoidHJvZWdlIiwiYSI6ImNsb3pra3A5bzAyNXUyaW8xamFqN3lxNnIifQ.F6LPCneZ4tJBvzKkiUleMg';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/troege/clqxt5ptc002r01p59crm5nkz',
            center: [9.99068, 48.398595],
            zoom: 15.53,
        });

        /*
        Add an event listener that runs
        when a user clicks on the map element.
        */
        map.on('click', (event) => {
            // If the user clicked on one of your markers, get its information.
            const features = map.queryRenderedFeatures(event.point, {
                layers: ['location-ulm'] // replace with your layer name
            });
            if (!features.length) {
                return;
            }
            const feature = features[0];

            /*
                Create a popup, specify its options
                and properties, and add it to the map.
              */
            const popup = new mapboxgl.Popup({ offset: [0, -15] })
                .setLngLat(feature.geometry.coordinates)
                .setHTML(
                    `<h3>${feature.properties.title}</h3>
                    <p>${feature.properties.description}</p>`
                )
                .addTo(map);
        });

    </script>



</div>
