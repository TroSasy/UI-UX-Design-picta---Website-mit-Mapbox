    <!-- mapbox js und css damit map so funktioniert wie gewollt -->

    <!---->

               <link rel="stylesheet" href="styles.css">

                <style>
                    #titlemap {
                    position: absolute;
                    z-index: 10;
                }
                    #map {
                    position: absolute;
                    top: 13.2rem; /*6.795rem*/
                    bottom: 0;
                    width: 87.8%;
                    margin-left: -2.5rem;
                    margin-right: -2.5rem;
                    z-index: 0;
                    border: black solid 1px;
                }
                </style>

    <div id="map">
        <script>

            // The value for 'accessToken' begins with 'pk...'
            //mapboxgl.accessToken = 'pk.eyJ1IjoidHJvZWdlIiwiYSI6ImNsb3pra3A5bzAyNXUyaW8xamFqN3lxNnIifQ.F6LPCneZ4tJBvzKkiUleMg';
            mapboxgl.accessToken = 'pk.eyJ1IjoidHJvZWdlIiwiYSI6ImNsb3pra3A5bzAyNXUyaW8xamFqN3lxNnIifQ.F6LPCneZ4tJBvzKkiUleMg';
            const map = new mapboxgl.Map({
                container: 'map',
                //style: 'mapbox://styles/troege/clqxt5ptc002r01p59crm5nkz',
                style: 'mapbox://styles/troege/clrw0skho00bs01qseqmo6dsj',
                center: [9.99068, 48.398595],
                zoom: 15.53,
            });

            /*
            Add an event listener that runs
            when a user clicks on the map element.
            */
            map.on('click', (event) => {
                // If the user clicked on one of your markers, get its information.
                const features = map.queryRenderedFeatures(event.point, {
                    layers: ['ulm-locations-v27012024'] // replace with your layer name from tileset
                });
                if (!features.length) {
                    return;
                }
                const feature = features[0];
                console.log(features);


                /*
                    Create a popup, specify its options
                    and properties, and add it to the map.
                  */
                const popup = new mapboxgl.Popup({ offset: [0, -15] })
                    .setLngLat(feature.geometry.coordinates)
                    .setHTML(
                        `<h3>${feature.properties.title}</h3><p>${feature.properties.description} </p> <img src="${feature.properties.image}" style="width: 100%">`
                    )
                    .addTo(map);
            });

        </script>
    </div>

    </div>
