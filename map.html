<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Map</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- mapbox js und css damit map so funktioniert wie gewollt -->
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet'/>
    <!---->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,700&family=Josefin+Sans:wght@100&family=Lato:wght@100&family=Montserrat+Alternates:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500;1,600&family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <style>

    </style>

</head>
<body>

<div class="navbar-container"></div> <!-- Hier wird DIV Navbar eingefügt -->

<main>
    <div>
        <div>
            <h1 id ="titlemap" class="bhero">Map</h1>
        </div>

    </div>
    <div id="map">
        <script>

            // access Token => 'pk...'
            mapboxgl.accessToken = 'pk.eyJ1IjoidHJvZWdlIiwiYSI6ImNsb3pra3A5bzAyNXUyaW8xamFqN3lxNnIifQ.F6LPCneZ4tJBvzKkiUleMg';
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/troege/clqxt5ptc002r01p59crm5nkz',
                center: [9.99068, 48.398595],
                zoom: 15.53,
            });

            /*
            Fügt einen Event Listener der überprüft ob Maus auf Kartenelement klickt
            */
            map.on('click', (event) => {
                // If the user clicked on one of your markers, get its information.
                const features = map.queryRenderedFeatures(event.point, {
                    layers: ['location-ulm']
                });
                if (!features.length) {
                    return;
                }
                const feature = features[0];

                /*
                Pop Up fenster
                  */
                const popup = new mapboxgl.Popup({ offset: [0, -15] })
                    .setLngLat(feature.geometry.coordinates)
                    .setHTML(
                        `<h3>${feature.properties.title}</h3><p>${feature.properties.description}</p> <p><img src=${feature.properties.image}></img>$</p><p>{feature.properties.image}</p>` //<p><img src="'+e.features[0].properties.image+'"/></p>
                    )
                    .addTo(map);
            });

        </script>
    </div>

</main>

<footer>

</footer>


<script src="navbar.js"></script> <!-- Hier wird JS Navbar eingefügt -->
</body>
</html>
