<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
<button id="uploadButton">Hochladen</button>

<div id="myModal" class="challenges-modal">
  <div class="challenges-modal-content">
    <span class="challenges-close">&times;</span>
    <form id="uploadForm">
      <label for="email">E-Mail:</label>
      <input type="email" id="email" name="email" required><br><br>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required><br><br>

      <input type="radio" id="imageUsage" name="usage" value="imageUsage" required>
      <label for="imageUsage">Ich bestätige die Nutzung meines Bildes</label><br>

      <input type="radio" id="emailNotification" name="usage" value="emailNotification" required>
      <label for="emailNotification">Ich will per E-Mail benachrichtigt werden</label><br><br>

      <input type="submit" value="Absenden">
    </form>
  </div>
</div>

<script src="uploadbutton.js"></script>
</body>
</html>
